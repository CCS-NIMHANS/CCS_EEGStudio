name: ccs_eeg_app
description: Lightweight EEG feature extraction and connectivity desktop app.
publish_to: none
version: 1.2.59+60

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.0.9
  xml: ^6.6.1
  crypto: ^3.0.7
  file_picker: ^11.0.2
  pdf: ^3.12.0
  printing: ^5.14.3
  package_info_plus: ^9.0.1
  media_kit: ">=1.1.10 <3.0.0"
  media_kit_video: ">=1.2.4 <3.0.0"
  media_kit_libs_video: ">=1.0.4 <3.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/group_stats.py
    - assets/source_regions.json
    - assets/source_review_geometry.json
  uses-material-design: true
  fonts:
    - family: DejaVuSans
      fonts:
        - asset: assets/fonts/DejaVuSans.ttf
